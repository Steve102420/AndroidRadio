name: APK fordítás

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Radio.apk

      # Zip nélküli APK, mindig ugyanazon a linken:
      # https://github.com/<felhasználó>/<tároló>/releases/latest/download/Radio.apk
      - name: Kiadás frissítése
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Radio.apk \
            --title "Rádió – legújabb verzió (#${{ github.run_number }})" \
            --notes "Töltsd le a Radio.apk fájlt a telefonodra, és telepítsd."

      - uses: actions/upload-artifact@v4
        with:
          name: radio-apk
          path: Radio.apk
